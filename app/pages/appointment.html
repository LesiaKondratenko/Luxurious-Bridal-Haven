<main>
<section class="appointment">
  <div class="container">
    <h2 class="appointment__title">BOOK AN APPOINTMENT</h2>
    <div class="appointment__box">

       <form action="" class="appointment__box-form">
        <p class="appointment__box-title">CONTACT INFORMATHION</p>
        <p class="appointment__box-text">Fill in your contact details</p>
          <input type="text" class="appointment__input" placeholder="First name">
          <input type="text" class="appointment__input" placeholder="Last name">
          <input type="email" class="appointment__input" placeholder="Email">
          <input type="text" class="appointment__input" placeholder="Mobile">
          <button class="appointment__btn" type="submit">SEND</button>  
        </form>

        <picture>
          <source srcset="images/appointment.avif" type="image/avif">
          <source srcset="images/appointment.webp" type="image/webp">
          <img src="images/appointment.jpg" alt="Alt text">
        </picture>  
    </div>
  </div>  
</section>
</main>
